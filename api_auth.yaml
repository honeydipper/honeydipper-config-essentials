drivers:
  daemon:
    services:
      api:
        auth-providers:
          - auth-simple
{%- if empty .options.auth_saml | not %}
          - auth-saml
{%- end %}
        auth:
          casbin:
            models:
              - |
                [request_definition]
                r = sub, principal, obj, act, provider

                [policy_definition]
                p = sub, obj, act, provider

                [role_definition]
                g = _, _
                g2 = _, _
                g3 = _, _

                [policy_effect]
                e = some(where (p.eft == allow))

                [matchers]
                m = (r.sub == p.sub && r.obj == p.obj && r.act == p.act && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (g(r.sub, p.sub) && g2(r.obj, p.obj) && r.act == p.act && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (g(r.sub, p.sub) && r.obj == p.obj && r.act == p.act && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (r.sub == p.sub && g2(r.obj, p.obj) && r.act == p.act && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (r.sub == p.sub && r.obj == p.obj && g3(r.act, p.act) && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (g(r.sub, p.sub) && g2(r.obj, p.obj) && g3(r.act, p.act) && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (g(r.sub, p.sub) && r.obj == p.obj && g3(r.act, p.act) && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (r.sub == p.sub && g2(r.obj, p.obj) && g3(r.act, p.act) && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (r.sub == p.sub && r.obj == p.obj && g3(r.act, 'read') && p.act == 'write' && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (g(r.sub, p.sub) && g2(r.obj, p.obj) && g3(r.act, 'read') && p.act == 'write' && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (g(r.sub, p.sub) && r.obj == p.obj && g3(r.act, 'read') && p.act == 'write' && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (r.sub == p.sub && g2(r.obj, p.obj) && g3(r.act, 'read') && p.act == 'write' && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (g(r.sub, p.sub) && p.obj == 'everything' && r.act == p.act && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (r.sub == p.sub && p.obj == 'everything' && r.act == p.act && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (g(r.sub, p.sub) && p.obj == 'everything' && g3(r.act, p.act) && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (r.sub == p.sub && p.obj == 'everything' && g3(r.act, p.act) && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (g(r.sub, p.sub) && p.obj == 'everything' && g3(r.act, 'read') && p.act == 'write' && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (r.sub == p.sub && p.obj == 'everything' && g3(r.act, 'read') && p.act == 'write' && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (p.sub == 'everyone' && r.obj == p.obj && r.act == p.act && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (p.sub == 'everyone' && g2(r.obj, p.obj) && r.act == p.act && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (p.sub == 'everyone' && r.obj == p.obj && g3(r.act, p.act) && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (p.sub == 'everyone' && g2(r.obj, p.obj) && g3(r.act, p.act) && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (p.sub == 'everyone' && r.obj == p.obj && g3(r.act, 'read') && p.act == 'write' && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (p.sub == 'everyone' && g2(r.obj, p.obj) && g3(r.act, 'read') && p.act == 'write' && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (p.sub == 'everyone' && p.obj == 'everything' && r.act == p.act && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (p.sub == 'everyone' && p.obj == 'everything' && g3(r.act, p.act) && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (p.sub == 'everyone' && p.obj == 'everything' && g3(r.act, 'read') && p.act == 'write' && (r.provider == p.provider || p.provider == 'everywhere')) \
                  || (r.sub == '@admin')

            policies:
              - |
                # define action groups
                g3, GET, read
                g3, POST, write
                g3, PUT, write
                g3, DELETE, write

                # define basic policy effects
                p, viewer, everything, read, auth-simple
                p, editor, everything, write, auth-simple
                p, everyone, everything, write, auth-gcp-iap

                p, everyone, user/profile, read, everywhere

{%- if empty .options.auth_saml | not %}
  auth-saml:
    acs_url: "http://localhost:9000/api/auth/saml/callback"
    idp_metadata_url: "http://localhost:8280/realms/master/protocol/saml/descriptor"
    jwt_signing_key: "your-secret-key-for-signing-jwt"
    entity_id: "honeydipper"  # must match client ID in Keycloak
    token_expiration: 3600
    name_id_format: "urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified"
    sp_key: placeholder-for-sp-private-key
    sp_cert: placeholder-for-sp-certificate
{%- end %}
