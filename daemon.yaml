---
drivers:
  daemon:
    featureMap:
      global:
        eventbus: redisqueue
        locker: redislock
        api-broadcast: api-broadcast
        cache: redis-cache
      engine:
        scheduler: redis-scheduler
    features:
      global:
        - name: "eventbus"
          required: true
        - name: "driver:redispubsub"
        - name: locker
        - name: api-broadcast
        - name: cache
      engine:
        - name: scheduler
{%- if empty .options.with_mcp | not %}
      agent:
        - name: "driver:mcp"
{%- end %}

    drivers:
      redisqueue:
        name: redisqueue
        type: builtin
        handlerData:
          shortName: redisqueue
        description: |
          redisqueue driver is used internally to facilitate communications between
          different components of Honeydipper system. It doesn't offer `rawActions` or
          `rawEvents` for workflow composing.
        meta:
          configurations: &redis
            - name: connection
              description: The parameters used for connecting to the redis including `Addr`, `Username`, `Password` and `DB`.
            - name: connection.TLS.Enabled
              description: Accept true/false. Use TLS to connect to the redis server, support TLS1.2 and above.
            - name: connection.TLS.InsecureSkipVerify
              description: Accept true/false. Skip verifying the server certificate. If enabled, TLS is susceptible to machine-in-the-middle attacks.
            - name: connection.TLS.VerifyServerName
              description: |
                When connecting using an IP instead of DNS name, you can override the name used for verifying
                against the server certificate. Or, use :code:`"*"` to accept any name or certificates without
                a valid common name as DNS name, no subject altertive names defined.
            - name: connection.TLS.CACerts
              description: |
                A list of CA certificates used for verifying the server certificate. These certificates are added on top
                of system defined CA certificates. See `Here <https://pkg.go.dev/crypto/x509#SystemCertPool>`_ for description
                on where the system defined CA certificates are.
          notes:
            - See below for an example
            - example: |
                ---
                drivers:
                  redisqueue:
                    connection:
                      Addr: 192.168.2.10:6379
                      DB: 2
                      Password: ENC[gcloud-kms,...masked]
                      TLS:
                        Enabled: true
                        VerifyServerName: "*"
                        CACerts:
                          - |
                            ----- BEGIN CERTIFICATE -----
                            ...
                            ----- END CERTIFICATE -----

      redispubsub:
        name: redispubsub
        type: builtin
        handlerData:
          shortName: redispubsub
        description: |
          redispubsub driver is used internally to facilitate communications between
          different components of Honeydipper system.
        meta:
          configurations: *redis
          notes:
            - See below for an example
            - example: |
                ---
                drivers:
                  redispubsub:
                    connection:
                      Addr: 192.168.2.10:6379
                      DB: 2
                      Password: ENC[gcloud-kms,...masked]
                      TLS:
                        Enabled: true
                        VerifyServerName: "*"
                        CACerts:
                          - |
                            ----- BEGIN CERTIFICATE -----
                            ...
                            ----- END CERTIFICATE -----

          rawActions:
            - name: send
              description: |
                broadcasting a dipper message to all Honeydipper services. This is used
                in triggering configuration reloading and waking up a suspended workflow.
                The payload of rawAction call will used as broadcasting dipper message
                paylod.
              parameters:
                - name: broadcastSubject
                  description: the subject field of the dipper message to be sent
              notes:
                - Below is an example of using the driver to trigger a configuration reload
                - example: |
                    ---
                    workflows:
                      reload:
                        call_driver: redispubsub.send
                        with:
                          broadcastSubject: reload
                          force: $?ctx.force
                - Below is another example of using the driver to wake up a suspended workflow
                - example: |
                    ---
                    workflows:
                      resume_workflow:
                        call_driver: redispubsub.send
                        with:
                          broadcastSubject: resume_session
                          key: $ctx.resume_token
                          labels:
                            status: $ctx.labels_status
                            reason: $?ctx.labels_reason
                          payload: $?ctx.resume_payload

      redislock:
        name: redislock
        type: builtin
        handlerData:
          shortName: redislock
        description: |
          redislock driver provides RPC calls for the services to acquire locks for synchronize and
          coordinate between instances.
        meta:
          configurations: *redis
          notes:
            - See below for an example
            - example: |
                ---
                drivers:
                  redislock:
                    connection:
                      Addr: 192.168.2.10:6379
                      DB: 2
                      Password: ENC[gcloud-kms,...masked]
                      TLS:
                        Enabled: true
                        VerifyServerName: "*"
                        CACerts:
                          - |
                            ----- BEGIN CERTIFICATE -----
                            ...
                            ----- END CERTIFICATE -----

            - This drive doesn't offer any raw actions as of now.

      redis-cache:
        name: redis-cache
        type: builtin
        handlerData:
          shortName: redis-cache
        description: |
          redis-cache driver is used internally to enabling caching
          capabilities for daemon and drivers. It offers a few RPCs for the
          other parts of the system to take advantage of the cache.
        meta:
          configurations: *redis
          notes:
            - See below for an example
            - example: |
                ---
                drivers:
                  redis-cache:
                    connection:
                      Addr: 192.168.2.10:6379
                      DB: 2
                      Password: ENC[gcloud-kms,...masked]
                      TLS:
                        Enabled: true
                        VerifyServerName: "*"
                        CACerts:
                          - |
                            ----- BEGIN CERTIFICATE -----
                            ...
                            ----- END CERTIFICATE -----

      api-broadcast:
        name: api-broadcast
        type: builtin
        handlerData:
          shortName: redispubsub
        description: |
          This driver shares the code with `redispubsub` driver. The purpose is provide a abstract
          feature for services to make broadcasts to each other. The current `redispubsub` driver
          offers a few functions through a `call_driver`. Once the `DipperCL` offers `call_feature`
          statement, we can consolidate the loading of the two drivers into one.
        meta:
          configurations: *redis
          notes:
            - See below for an example
            - example: |
                ---
                drivers:
                  redispubsub:
                    connection:
                      Addr: 192.168.2.10:6379
                      DB: 2
                      Password: ENC[gcloud-kms,...masked]
                      TLS:
                        Enabled: true
                        VerifyServerName: "*"
                        CACerts:
                          - |
                            ----- BEGIN CERTIFICATE -----
                            ...
                            ----- END CERTIFICATE -----

            - This driver doesn't offer any actions or functions.

      auth-gcp-iap:
        name: auth-gcp-iap
        type: builtin
        handlerData:
          shortName: auth-gcp-iap

      auth-simple:
        name: auth-simple
        type: builtin
        handlerData:
          shortName: auth-simple
        description: |
          This driver provides RPCs for the API serive to authenticate the incoming requests. The
          supported method includes basic authentication, and token authentication. This also acts
          as a reference on how to implement authentication for honeydipper APIs.
        meta:
          configurations:
            - name: schemes
              description: a list of strings indicating authenticating methods to try, support `basic` and `token`.
            - name: users
              description: a list of users for `basic` authentication.
            - name: users.name
              description: the name of the user
            - name: users.pass
              description: the password (use encryption)
            - name: users.subject
              description: a structure describing the credential, used for authorization
            - name: tokens
              description: |
                a map of tokens to its subjects, each subject is a structure describing
                the credential, used for authorization.

          notes:
            - See below for an example
            - example: |
                ---
                drivers:
                  auth-simple:
                    schemes:
                      - basic
                      - token
                    users:
                      - name: user1
                        pass: ENC[...]
                        subject:
                          group: engineer
                          role: viewer
                      - name: admin
                        pass: ENC[...]
                        subject:
                          group: sre
                          role: admin
                    tokens:
                      ioefui3wfjejfasf:
                        subject:
                          group: machine
                          role: viewer
            - This driver doesn't offer any actions or functions.

{%- if empty .options.auth_saml | not %}
      auth-saml:
        name: auth-saml
        type: builtin
        handlerData:
          shortName: auth-saml
        description: |
          This driver enables SAML 2.0 Service Provider (SP) authentication for the Honeydipper
          API service. It handles SP-initiated login, ACS callback validation, session token
          issuance via JWT, and SP metadata serving for IdP configuration.

          When SAML login is complete the API authorization still uses Casbin, so SSO identity
          and access policy remain separate. SAML assertion attributes are available in the
          principal object (`r.principal.Data`) for claim-based Casbin rules.

          The following API endpoints are provided by the API service when this driver is active:

          - `GET /api/auth/saml/login` — returns a redirect URL for SP-initiated login
          - `GET /api/auth/saml/metadata` — returns SP metadata XML for IdP registration
          - `POST /api/auth/saml/callback` — ACS endpoint, validates SAMLResponse and returns a JWT
          - `GET /api/auth/saml/callback` — same as POST, for IdP-initiated flows (when enabled)
        meta:
          configurations:
            - name: acs_url
              description: |
                The Assertion Consumer Service (ACS) URL that the IdP will post the SAMLResponse
                to. This must be registered with your IdP and match the URL exposed by the
                Honeydipper API service (e.g. `https://hd.example.com/api/auth/saml/callback`).
            - name: idp_metadata_url
              description: |
                The URL from which the driver fetches the IdP metadata XML at startup. Must be
                reachable from the daemon runtime.
            - name: entity_id
              description: |
                The SP entity ID advertised in SP metadata. Optional; defaults to `acs_url`.
            - name: allow_idp_initiated
              description: |
                Accept true/false. Allow IdP-initiated login flows. Optional; defaults to `false`.
                Keep disabled unless your SSO flow explicitly requires it.
            - name: token_expiration
              description: |
                How long (in seconds) an issued Honeydipper JWT session token remains valid.
                Optional; defaults to `86400` (24 hours).
            - name: request_ttl
              description: |
                How long (in seconds) a pending SAML relay-state entry is kept before it expires.
                Optional; defaults to `600` (10 minutes). Keep this short to reduce the replay
                window for stale relay states.
            - name: jwt_signing_key
              description: |
                The secret used to sign and verify Honeydipper JWT session tokens. Use a strong
                random value. In production, prefer the `AUTH_SAML_JWT_SIGNING_KEY` environment
                variable over storing the key in config files.
          notes:
            - See below for a minimal driver configuration example
            - example: |
                ---
                drivers:
                  auth-saml:
                    acs_url: https://hd.example.com/api/auth/saml/callback
                    idp_metadata_url: https://idp.example.com/metadata
                    entity_id: https://hd.example.com/saml/sp
                    allow_idp_initiated: false
                    token_expiration: 86400
                    request_ttl: 600
                    jwt_signing_key: ENC[gcloud-kms,...masked]
            - |
              To enable the driver, add it to the API auth-providers list and configure a
              Casbin policy. See below for a daemon-level snippet.
            - example: |
                ---
                drivers:
                  daemon:
                    services:
                      api:
                        auth-providers:
                          - auth-saml
                        auth:
                          casbin:
                            models:
                              - |
                                [request_definition]
                                r = sub, principal, obj, act, provider

                                [policy_definition]
                                p = sub, obj, act, provider

                                [role_definition]
                                g = _, _

                                [policy_effect]
                                e = some(where (p.eft == allow))

                                [matchers]
                                m = (r.sub == p.sub && r.obj == p.obj && r.act == p.act && r.provider == p.provider) \
                                  || (g(r.sub, p.sub) && r.obj == p.obj && r.act == p.act && r.provider == p.provider)

                            policies:
                              - |
                                p, everyone, user/profile, read, auth-saml
                                g, alice@example.com, everyone
            - This driver doesn't offer any rawActions or rawEvents for workflow composing.
{%- end %}

      redis-scheduler:
        name: redis-scheduler
        type: builtin
        handlerData:
          shortName: hd-driver-redis-scheduler

      mcp:
        name: mcp
        type: builtin
        handlerData:
          shortName: hd-driver-mcp
        description: |
          mcp driver is an implementation of the MCP (Mesh Configuration Protocol) for Honeydipper.
          It enables the agents to inovoke actions on integrated systems through the MPC protocol.
          It is intended to be used by agent services, not directly by the workflow, and doesn't
          offer `rawActions` or `rawEvents` for workflow composing.
        meta:
          configurations:
            - servers:
                description: |
                  A list of MCP servers to connect to. Each server should include the necessary
                  connection parameters such as address, port, and authentication credentials.
              type: object
            - servers.*.url:
                description: The URL of the MCP server, including the protocol (e.g., `https://`), host, and port.
                type: string
            - servers.*.transport:
                description: '"streamable" or "sse", defaults to "streamable".'
                type: string
            - servers.*.headers:
                description: Optional additional headers to include in MCP requests, such as authentication tokens.
                type: object
          notes:
            - See below for an example
            - example: |
                ---
                drivers:
                  mcp:
                    servers:
                      my-mcp-server:
                        url: https://mcp.example.com:8443
                        transport: streamable
                        headers:
                          Authorization: Bearer abcdef123456

  redisqueue:
    connection:
      Addr: 127.0.0.1:6379

  redispubsub:
    connection:
      Addr: 127.0.0.1:6379

  redislock:
    connection:
      Addr: 127.0.0.1:6379

  api-broadcast:
    topic: honeydipper:api-broadcast
    channel: api
    connection:
      Addr: 127.0.0.1:6379
