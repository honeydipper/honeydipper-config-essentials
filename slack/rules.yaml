---
rules:
  - when:
      source:
        system: slack_bot
        trigger: interact
    do:
      with:
        resume_message:
          payload:
            slack_payload: $ctx.slack_payload
        slack_resume_key: $ctx.slack_payload.callback_id,ctx.slack_payload.actions.0.block_id
      if_match:
        slack_resume_key: ':regex:^hd-resume-'
      resume: $ctx.slack_resume_key
      context: mute
{%- if empty .options.skip_slack_webhooks %}

  - when:
      source:
        system: slack_bot
        trigger: slashcommand
    do:
      context: _slashcommands
      call_workflow: slashcommand

  # responding to ignored events
  - when:
      source:
        system: slack_bot
        trigger: events
    do:
      context: mute

  # responding to slack event url verification
  - when:
      source:
        system: slack_bot
        trigger: event_verification
    do:
      context: mute
{%- end %}