---
includes:
  - daemon.yaml
  - web.yaml
  - webhook.yaml
  - contexts.yaml
  - api_auth.yaml
  - workflow_helper.yaml

# following are loaded by default
{%- if empty .options.without_github %}
  - github.yaml
{%- end %}
{%- if empty .options.without_slack %}
  - slack/init.yaml
{%- end %}
{%- if empty .options.without_kubernetes %}
  - kubernetes/init.yaml
{%- end %}

# following can be loaded optionally
{%- if empty .options.opsgenie | not %}
  - opsgenie.yaml
{%- end %}
{%- if empty .options.jira | not %}
  - jira.yaml
{%- end %}
{%- if empty .options.circleci | not %}
  - circleci.yaml
{%- end %}
{%- if empty .options.pagerduty | not %}
  - pagerduty.yaml
{%- end %}
{%- if empty .options.codeclimate | not %}
  - codeclimate/init.yaml
{%- end %}
{%- if empty .options.datadog | not %}
  - datadog/init.yaml
{%- end %}
{%- if empty .options.gcloud | not %}
  - gcloud/init.yaml
{%- end %}
{%- if empty .options.vault | not %}
  - vault/init.yaml
{%- end %}
{%- if empty .options.ai | not %}
  - ai/init.yaml
{%- end %}
{%- if empty .options.ai_gemini | not %}
  - ai/gemini.yaml
{%- end %}
